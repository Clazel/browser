[package]
name = "clazel-renderer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The renderer stub: enters the OS sandbox before reading a byte, then runs a script of document.cookie and localStorage operations over its socket."

[dependencies]
# The wire format: frames and messages (items 2.1 to 2.3).
clazel-ipc = { path = "../clazel-ipc" }
# The sandbox policies as data (item 2.14): the renderer applies them.
clazel-sandbox = { path = "../clazel-sandbox" }
# The only way into the OS sandbox (item 2.0). Safe functions; the renderer
# contains no `unsafe`.
clazel-sys = { path = "../clazel-sys" }

# Verification tier (docs/VERIFICATION.md). Tier 0: tests only. The sandbox
# calls are audited (docs/SYS-AUDITS.md) and exercised by the integration
# tests of items 2.15 and 2.16; they cannot be proven.
[package.metadata.clazel]
tier = 0
target-tier = 0

[lints]
workspace = true

# A test with its own `main`: it enters the real sandbox in a child process of
# its own, which a test harness (a thread per test) could not do on Linux.
[[test]]
name = "sandbox"
harness = false
