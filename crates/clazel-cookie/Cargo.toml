[package]
name = "clazel-cookie"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RFC 6265bis cookies: dates, host names, domain and path matching, Set-Cookie parsing."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
# §5.1.2 canonicalized host names are the URL Standard's host parser and
# serializer (a modelling choice, see the header of src/matching/spec.rs).
clazel-url = { path = "../clazel-url" }
# §5.7 step 9 and §5.8.3 step 3 ask whether a domain is a public suffix, and
# the cookie root (the isolation boundary, see src/storage/spec.rs) is
# defined over the Public Suffix List.
clazel-psl = { path = "../clazel-psl" }
# §5.2 "same-site" requests are the HTML Standard's "same site" of origins.
clazel-origin = { path = "../clazel-origin" }

[dev-dependencies]
# The reference engine of tests/conformance_differential.rs: the cookie jar
# of reqwest's `cookie_store` feature, which follows RFC 6265. Without its
# default features (no Public Suffix List, no serde).
cookie_store = { version = "=0.21.1", default-features = false }
# Pinned to 0.3.17 so the Cargo.lock holds the fewest packages (see
# docs/DEPENDENCIES.md); cookie_store asks for ^0.3.16.
time = { version = "=0.3.17", default-features = false }
url = { version = "=2.5.8", default-features = false }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires.
# Phase 2 items 2.7 to 2.9 (RFC 6265bis §5.1 to §5.8) are specified,
# implemented and proven here, with their independent transcriptions, kill-
# certified mutations and conformance suites.
[package.metadata.clazel]
tier = 2
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true
