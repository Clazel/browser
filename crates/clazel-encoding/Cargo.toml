[package]
name = "clazel-encoding"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WHATWG Encoding Standard: UTF-8 decode/encode."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"

# Test-only engines for the differential test in tests/conformance_utf8.rs
# (class `test` in docs/DEPENDENCIES.md: never shipped).
[dev-dependencies]
encoding_rs = "=0.8.35"

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires. The UTF-8
# decoder is proven to meet its contract, has a proven-equivalent independent
# transcription, and every mutation is certified killed, but Tier 2 also needs
# conformance tests and the encoder (docs/phases/phase-1.md items 1.3-1.4),
# so it stays at Tier 0 until then.
[package.metadata.clazel]
tier = 0
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true
