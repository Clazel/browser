[package]
name = "clazel-percent"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WHATWG URL Standard §1.3: percent-encoded bytes and the percent-encode sets."

[dependencies]
vstd = "=0.0.0-2026-10-04-0306"
# "UTF-8 percent-encode" and string percent-decode use the proven UTF-8
# encoder (Encoding §6 "UTF-8 encode") rather than a second copy of it.
clazel-encoding = { path = "../clazel-encoding" }

# Verification tier (docs/VERIFICATION.md). `tier` is what is proven about
# the shipped code today; `target-tier` is what the policy requires.
[package.metadata.clazel]
tier = 0
target-tier = 2

[package.metadata.verus]
verify = true

[lints]
workspace = true
