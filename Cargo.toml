[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Tier 0 of docs/VERIFICATION.md: these apply to every crate. A crate may not
# loosen them; the single exception for `unsafe` is `crates/clazel-sys`, which
# lists these lints itself with `unsafe_code = "allow"` and nothing else
# changed (CLAUDE.md rule 1; `cargo xtask check` compares the two lists).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Verus sets `verus_only` while verifying; it may only guard ghost imports.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)"] }

[workspace.lints.clippy]
# Code that parses untrusted input must never panic. Kani proves the absence
# of panics in Tier 1+ crates; these lints stop the obvious sources up front.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
overflow-checks = true
